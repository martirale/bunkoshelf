services:
  bunkoshelf:
    image: bunkoshelf:latest
    container_name: bunkoshelf
    ports:
      - "3000:3000"
      - "4000:4000"
    volumes:
      - /path/to/your/library:/app/library
      - ./data:/app/prisma
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://0.0.0.0:4000
    restart: unless-stopped
